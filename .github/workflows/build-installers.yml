name: Build installers

# Reusable: freezes the engine and builds the Windows installers from the
# calling workflow's checkout. Acceptance and release runs share this job so
# the binaries that get tested are the binaries that ship.
on:
  workflow_call:
    outputs:
      version:
        description: Version read from desktop/src-tauri/tauri.conf.json
        value: ${{ jobs.build.outputs.version }}
      artifact:
        description: Name of the uploaded artifact holding the NSIS and MSI installers
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the version the installers will carry
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $msiVersion = ''
          if ($version -match '^3\.0\.0-beta\.([1-9]\d*)$') {
            $betaNumber = [long]::Parse($Matches[1])
            if ($betaNumber -gt 65535) { throw "Beta number exceeds MSI version range: $version" }
            # MSI compares only numeric fields; keep beta below 3.0.0 final.
            $msiVersion = "2.99.$betaNumber"
          } elseif ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Unexpected version in tauri.conf.json: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=installers-$version" >> $env:GITHUB_OUTPUT
          "msi_version=$msiVersion" >> $env:GITHUB_OUTPUT
      - name: Build frozen engine
        shell: pwsh
        run: |
          python -m pip install . pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'Python installation failed' }
          python -m PyInstaller --noconfirm packaging/formslang-engine.spec
          if ($LASTEXITCODE -ne 0) { throw 'Engine build failed' }
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/formslang-engine.exe desktop/src-tauri/binaries/formslang-engine-x86_64-pc-windows-msvc.exe
      - name: Build Windows installers
        shell: pwsh
        env:
          MSI_VERSION: ${{ steps.version.outputs.msi_version }}
        run: |
          npm --prefix desktop ci
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependencies failed' }
          $env:CI='true'
          if ($env:MSI_VERSION) {
            $tauriConfig = Join-Path $env:RUNNER_TEMP 'formslang-tauri-beta.json'
            @{ bundle = @{ windows = @{ wix = @{ version = $env:MSI_VERSION } } } } |
              ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $tauriConfig -Encoding utf8
            npm --prefix desktop run tauri -- build --config $tauriConfig
          } else {
            npm --prefix desktop run tauri -- build
          }
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Check the installers carry that version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $bundle = 'desktop/src-tauri/target/release/bundle'
          foreach ($name in @("nsis/FormsLang_${env:VERSION}_x64-setup.exe", "msi/FormsLang_${env:VERSION}_x64_en-US.msi")) {
            if (-not (Test-Path -LiteralPath "$bundle/$name")) { throw "Installer not found: $name" }
            $hash = (Get-FileHash -LiteralPath "$bundle/$name" -Algorithm SHA256).Hash
            Write-Output "$hash  $(Split-Path $name -Leaf)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7
