name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install formslang (dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formslang (dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check .

  browser:
    name: workbench browser acceptance (Edge)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install formslang
        run: python -m pip install -e .
      - name: Exercise Blueprint and conversion with an isolated offline fixture
        run: python examples/verify/workbench_browser_check.py --output "${{ runner.temp }}/browser-check"
      - name: Keep screenshots and browser check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-browser-evidence
          path: |
            ${{ runner.temp }}/browser-check/**/result.json
            ${{ runner.temp }}/browser-check/**/*.png
          if-no-files-found: warn
          retention-days: 14

  # The promise docs/ci-cd.md is built on: the same session exports the
  # same bytes. Export the showcase module from its XML, then again from
  # the session that first run created, and require identical ZIPs.
  export:
    name: deterministic export (showcase module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formslang
        run: python -m pip install -e .

      - name: Export twice, compare bytes
        run: |
          python -m formslang export tests/fixtures/showcase/module.xml \
            -o "$RUNNER_TEMP/smoke" --alias showcase --app-id 19078
          cp "$RUNNER_TEMP/smoke/export/showcase.apex.zip" "$RUNNER_TEMP/first.zip"
          python -m formslang export "$RUNNER_TEMP/smoke/DEMO_ALL_ELEMENTS.session.db" --json
          cmp "$RUNNER_TEMP/first.zip" "$RUNNER_TEMP/smoke/export/showcase.apex.zip"
          sha256sum "$RUNNER_TEMP/first.zip"

  # The one Oracle verdict that costs nothing: `apex validate` compiles the
  # exported package against the APEXlang grammar bundled in SQLcl's own
  # apexlang-compiler.jar, so every push gets a real Oracle check with no
  # database, no workspace and no credentials anywhere near the runner.
  # The negative control is half the gate -- a check that cannot fail is not
  # a check, so a deliberately broken region type must turn this job red.
  validate:
    name: apex validate (SQLcl, no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # SQLcl is a Java program and ships no runtime of its own.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SQLcl
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sqlcl.zip" \
            https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip
          unzip -q "$RUNNER_TEMP/sqlcl.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/sqlcl/bin/sql"
          "$RUNNER_TEMP/sqlcl/bin/sql" -v
          echo "FORMSLANG_SQLCL_PATH=$RUNNER_TEMP/sqlcl/bin/sql" >> "$GITHUB_ENV"

      - name: Install formslang
        run: python -m pip install -e .

      - name: Export the showcase module
        run: |
          python -m formslang export tests/fixtures/showcase/module.xml \
            -o "$RUNNER_TEMP/gate" --alias showcase --app-id 19078

      - name: The export must validate
        run: |
          python -m formslang apex validate \
            "$RUNNER_TEMP/gate/export/showcase.apex.zip" --offline

      - name: A broken package must fail the same gate
        run: |
          python - "$RUNNER_TEMP/gate/export/showcase.apex.zip" "$RUNNER_TEMP/broken.apex.zip" <<'PY'
          import sys
          import zipfile

          src, dst = sys.argv[1], sys.argv[2]
          old, new = b"type: interactiveGrid", b"type: notARealRegionType"

          with zipfile.ZipFile(src) as zin:
              entries = [(info, zin.read(info.filename)) for info in zin.infolist()]

          hits = 0
          with zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as zout:
              for info, data in entries:
                  if old in data:
                      data = data.replace(old, new)
                      hits += 1
                  zout.writestr(info, data)

          if not hits:
              sys.exit(f"nothing to break: no {old.decode()!r} left in the export")
          print(f"patched {hits} entries")
          PY
          if python -m formslang apex validate "$RUNNER_TEMP/broken.apex.zip" --offline; then
            echo "::error::an invalid region type passed validation -- the gate checks nothing"
            exit 1
          fi

      # The export above has nothing approved, so it carries no validation.
      # Approve the module's WHEN-VALIDATE triggers and export again: the
      # component this project writes by hand is the one Oracle should be
      # checking on every push.
      - name: Export the same module with its rules approved
        run: |
          python - "$RUNNER_TEMP/rules" <<'PY'
          import sys
          from pathlib import Path

          from formslang.apexlang import export_apexlang
          from formslang.convert import Proposal, build_tasks
          from formslang.parser import parse_xml
          from formslang.store import APPROVED, Store

          out = Path(sys.argv[1])
          out.mkdir(parents=True, exist_ok=True)
          xml = Path("tests/fixtures/showcase/module.xml")

          module = parse_xml(xml)
          store = Store(out / "showcase.session.db")
          store.init_session(module.name, str(xml))
          tasks = build_tasks(module)
          store.add_tasks(tasks)

          rules = {"WHEN-VALIDATE-ITEM", "WHEN-VALIDATE-RECORD"}
          # Two rules are approved as code that raises without saying anything.
          # A real review produces both kinds, and the message the user reads
          # has to come from the Forms trigger when the code is silent.
          silent = {"FK_CATEGORIA", "BK_ITENS"}
          approved = 0
          for task in tasks:
              if task.kind != "trigger" or task.name.upper() not in rules:
                  continue
              item = (task.owner.split(".")[-1] or "X").upper()
              raises = (
                  "raise value_error;"
                  if item in silent
                  else "raise_application_error(-20001, 'value is required');"
              )
              code = (
                  "begin\n"
                  f"  if :P0_{item} is null then\n"
                  f"    {raises}\n"
                  "  end if;\n"
                  "end;"
              )
              store.save_proposal(task.id, Proposal(code=code, apex_target="Page validation"))
              store.set_decision(task.id, APPROVED, code=code, reviewer="ci")
              approved += 1

          if not approved:
              sys.exit("the showcase has no WHEN-VALIDATE trigger left to approve")

          result = export_apexlang(store, module, out, {"alias": "showcase", "app_id": 19078})
          pages = sorted((result.project / "pages").glob("*.apx"))
          text = "".join(p.read_text(encoding="utf-8") for p in pages)
          emitted = text.count("\n    validation forms-")
          if emitted != approved:
              sys.exit(f"approved {approved} rules but the package has {emitted} validations")
          if "associatedItem: @" not in text:
              sys.exit("no validation points at a page item -- the reference is never tested")
          # APEX prints the validation's errorMessage and never the error the
          # code raises, so a package that ships the placeholder ships a rule
          # whose message nobody can read.
          if "Replace this text with the message" in text:
              sys.exit("a validation still carries the placeholder error message")
          if 'errorMessage: "Categoria inexistente. Use a lista (F9)."' not in text:
              sys.exit("the silent rule did not inherit the wording of its Forms trigger")
          print(f"{approved} approved rules -> {emitted} page validations")
          PY

      - name: The package with rules must validate
        run: |
          python -m formslang apex validate \
            "$RUNNER_TEMP/rules/showcase.apex.zip" --offline

      # The item a validation points at is resolved by the compiler, so a
      # page item that was never emitted is a broken package -- which is why
      # the exporter only points at items it can see in the emitted layout.
      - name: A validation pointing at a missing item must fail
        run: |
          python - "$RUNNER_TEMP/rules/showcase.apex.zip" "$RUNNER_TEMP/dangling.apex.zip" <<'PY'
          import re
          import sys
          import zipfile

          src, dst = sys.argv[1], sys.argv[2]
          old = re.compile(rb"associatedItem: @[A-Za-z0-9_$#]+")
          new = b"associatedItem: @NO_SUCH_PAGE_ITEM"

          with zipfile.ZipFile(src) as zin:
              entries = [(info, zin.read(info.filename)) for info in zin.infolist()]

          hits = 0
          with zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as zout:
              for info, data in entries:
                  data, n = old.subn(new, data, count=1)
                  hits += n
                  zout.writestr(info, data)

          if not hits:
              sys.exit("nothing to break: no associatedItem left in the export")
          print(f"patched {hits} entries")
          PY
          if python -m formslang apex validate "$RUNNER_TEMP/dangling.apex.zip" --offline; then
            echo "::error::a validation on a missing page item passed -- references are not checked"
            exit 1
          fi

      # The demo fixture, beside the showcase. The showcase proves breadth;
      # the minicase is the module a viewer is actually walked through, so the
      # package it produces has to be green on every push too. Its shape --
      # six review units, the six required elements, message provenance -- is
      # guarded by tests/test_minicase_fixture.py, which needs no SQLcl. What
      # only SQLcl can answer is whether Oracle's own compiler accepts it.
      - name: Export the minicase with its rules approved
        run: |
          python - "$RUNNER_TEMP/minicase" <<'PY'
          import sys
          from pathlib import Path

          from formslang.apexlang import export_apexlang
          from formslang.convert import Proposal, build_tasks
          from formslang.parser import parse_xml
          from formslang.rules import AUTO
          from formslang.store import APPROVED, Store

          out = Path(sys.argv[1])
          out.mkdir(parents=True, exist_ok=True)
          xml = Path("tests/fixtures/minicase/module.xml")

          module = parse_xml(xml)
          store = Store(out / "minicase.session.db")
          store.init_session(module.name, str(xml))
          tasks = build_tasks(module)
          store.add_tasks(tasks)

          # One rule is approved as code that raises without saying anything,
          # so its message can only come from the Forms trigger it replaces.
          silent = "BK_PRODUTO.VL_PRECO.WHEN-VALIDATE-ITEM"
          approved = 0
          for task in tasks:
              if task.verdict != AUTO:
                  continue
              key = f"{task.owner}.{task.name}"
              code = (
                  "begin\n  raise value_error;\nend;"
                  if key == silent
                  else "begin\n  raise_application_error(-20001, 'aprovado pelo CI');\nend;"
              )
              store.save_proposal(task.id, Proposal(code=code, apex_target="Page validation"))
              store.set_decision(task.id, APPROVED, code=code, reviewer="ci")
              approved += 1

          if approved != 3:
              sys.exit(f"the minicase should offer three AUTO rules, found {approved}")

          result = export_apexlang(store, module, out, {"alias": "minicase", "app_id": 19200})
          print(f"{approved} approved rules -> {result.zip_path.name}")
          PY

      - name: The minicase package must validate
        run: |
          python -m formslang apex validate \
            "$RUNNER_TEMP/minicase/minicase.apex.zip" --offline
