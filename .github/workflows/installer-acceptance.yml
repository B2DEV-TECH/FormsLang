name: Installer acceptance

# Manual. Builds the installers from the selected ref, then on separate
# disposable Windows runners installs the previous release, saves a review
# through it, upgrades to the freshly built candidate and verifies that the
# review, the export and the native desktop survived. The candidate version
# comes from the checkout; the baseline defaults to the latest published
# release, so a candidate that is already published must name its baseline.
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Release to upgrade from (version without v). Empty = latest published release.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-installers.yml

  upgrade:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kind: [nsis, msi]
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: installer-assets/built
      - name: Resolve the baseline release
        shell: pwsh
        env:
          REQUESTED: ${{ inputs.baseline }}
        run: |
          $baseline = $env:REQUESTED
          if (-not $baseline) {
            $baseline = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name) -replace '^v', ''
            if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the latest published release' }
          }
          if ($baseline -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid baseline version: $baseline" }
          if ($baseline -eq $env:CANDIDATE) { throw "Baseline $baseline is the candidate itself; pass the release to upgrade from" }
          "BASELINE=$baseline" >> $env:GITHUB_ENV
          Write-Output "Upgrade path: $baseline -> $env:CANDIDATE"
      - name: Download the baseline release installers
        shell: pwsh
        run: |
          gh release download "v$env:BASELINE" --dir installer-assets/baseline --pattern '*.exe' --pattern '*.msi'
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          New-Item -ItemType Directory -Force installer-assets/candidate | Out-Null
          Get-ChildItem installer-assets/built -Recurse -File | Copy-Item -Destination installer-assets/candidate
      - name: Install, save review, upgrade, verify
        shell: pwsh
        run: ./examples/verify/installer_upgrade.ps1 -Kind '${{ matrix.kind }}' -BaselineVersion $env:BASELINE -CandidateVersion $env:CANDIDATE
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.kind }}-evidence
          path: ${{ runner.temp }}/formslang-installer-${{ matrix.kind }}/
          retention-days: 7
