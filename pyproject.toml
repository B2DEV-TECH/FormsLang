[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formslang"
version = "0.1.0"
description = "Oracle Forms analysis and AI-assisted conversion to Oracle APEX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "B2DEV TECH" }]
keywords = ["oracle", "forms", "apex", "migration", "plsql", "legacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
# FormsLang runs on the Python standard library alone -- analysis, AI calls,
# session storage and the review UI included. It has to work on locked-down
# machines inside a customer network, where installing a package is a ticket.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
formslang = "formslang.cli:main"

[tool.setuptools.packages.find]
include = ["formslang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 95
target-version = "py310"
