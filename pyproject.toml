[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formslang"
version = "0.1.6"
description = "Oracle Forms analysis and AI-assisted conversion to Oracle APEX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Geraldo Viana Jr" }]
keywords = ["oracle", "forms", "apex", "migration", "plsql", "legacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
# FormsLang runs on the Python standard library alone -- analysis, AI calls,
# session storage and the review UI included. It has to work on locked-down
# machines where installing a package is a change request.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
formslang = "formslang.cli:main"

[tool.setuptools.packages.find]
include = ["formslang*"]

[tool.setuptools.package-data]
formslang = [
    "templates/apexlang26/*.apx",
    "templates/apexlang26/.apex/*.json",
    "templates/apexlang26/deployments/*.json",
    "templates/apexlang26/pages/*.apx",
    "templates/apexlang26/shared-components/*.apx",
    "templates/apexlang26/shared-components/static-files/icons/*.png",
    "templates/apexlang26/shared-components/themes/universal-theme/*.apx",
    "templates/apexlang26/supporting-objects/*.apx",
    "templates/apexlang26/supporting-objects/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
# DTZ005 (datetime.now() without tz): authstore.py/store.py/cli.py store and
# compare NAIVE datetimes throughout (session expiry, lockouts, token TTLs).
# Adding tz=timezone.utc to individual call sites would raise TypeError on
# comparison against the naive values already on disk -- a real fix needs an
# atomic migration of the whole naive-datetime scheme, not a per-line patch.
ignore = ["DTZ005"]
